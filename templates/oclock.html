    <!-- I should probably feel bad for using so many libraries, but apparently this is the way thing are done :-/ -->

    <script src="{{ url_for('static', filename='js/leaflet.rotatedMarker.js') }}"></script>

    <script src="{{ url_for('static', filename='js/utils.js') }}"></script>

    <!-- car.js: just for the multi-user identity helpers (my_car_client_id,
         getMyCarName, isMyOwnCarTelemetry, startSharingMyLocation,
         my_device_position_active) - this page doesn't render other
         chasers, so its map-marker functions are never called here. -->
    <script src="{{ url_for('static', filename='js/car.js') }}"></script>



    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <script type="text/javascript" charset="utf-8">


        // Chase car position.
        // properties will contain:
        //   latest_data: [lat,lon, alt] (latest car position)
        //   heading: Car heading (to point icon appropriately.)
        //   marker: Leaflet marker
        var chase_car_position = {latest_data: [0.0,0.0,0.0], heading:0, marker: 'NONE', path: 'NONE'};

        var current_bearing = 0;

        var bearing_length = 20000;


        // These values are set to a instantaneous time when a button is clicked.
        var timeSeqEnabled = false;
        var timeSeqActive = 25;
        var timeSeqCycle = 120;
        var timeSeqTimes = [0,0,0,0];

        var chase_config = {};

        function handleSettings(data){
            chase_config = data;

            timeSeqEnabled = chase_config.time_seq_enabled;
            timeSeqActive = chase_config.time_seq_active;
            timeSeqCycle = chase_config.time_seq_cycle;
            timeSeqTimes = chase_config.time_seq_times;
        }

        function getCurrentSeqNumber(offset_seconds){
            // Determine the current transmitter number, based on current time and the timeSeqTimes.
            // Optional offset_seconds argument, to enable testing times slightly into the future.

            if (typeof offset_seconds === 'undefined') {
                offset_seconds = 0;
            }

            var _current_time = Date.now() + offset_seconds*1000;

            if(timeSeqTimes[0] > 0){
                if ((_current_time - timeSeqTimes[0]) % (timeSeqCycle*1000) < timeSeqActive*1000){
                    return 0
                }
            }
            if(timeSeqTimes[1] > 0){
                if ((_current_time - timeSeqTimes[1]) % (timeSeqCycle*1000) < timeSeqActive*1000){
                    return 1
                }
            }
            if(timeSeqTimes[2] > 0){
                if ((_current_time - timeSeqTimes[2]) % (timeSeqCycle*1000) < timeSeqActive*1000){
                    return 2
                }
            }
            if(timeSeqTimes[3] > 0){
                if ((_current_time - timeSeqTimes[3]) % (timeSeqCycle*1000) < timeSeqActive*1000){
                    return 3
                }
            }
            return -1;
        }

        function updateTimeSeqClock(){
            var $chip = $('#bpFoxChip');
            if(timeSeqEnabled == true){
                var _current_seq = getCurrentSeqNumber();
                if( _current_seq >= 0 ){

                    var _current_time = Date.now();
                    var _seqtime = timeSeqActive - ((_current_time - timeSeqTimes[_current_seq]) % (timeSeqCycle*1000))/1000.0;

                    $('#bpFoxChipText').text('FOX ' + _current_seq + ' · ' + _seqtime.toFixed(1) + 's');
                    $chip.addClass('is-active');

                } else {
                    $chip.removeClass('is-active');
                }

            } else {
                $chip.removeClass('is-active');
            }
        }

        // Socket.IO Settings
        var namespace = '/chasemapper';
        // Socket.IO instance.
        var socket;

        // 12 clock positions, laid out as a ring of large touch-target
        // buttons (see static/css/oclock.css). Placed as percentages of the
        // ring container so the same layout works at both the desktop and
        // mobile ring sizes without recomputing on resize.
        var OCLOCK_RADIUS_PCT = 43;

        function buildOclockRing(){
            var $ring = $('#oclockRing');
            for (var i = 1; i <= 12; i++){
                var _bearing = (i % 12) * 30;
                var _rad = _bearing * Math.PI / 180;
                var _left = 50 + OCLOCK_RADIUS_PCT * Math.sin(_rad);
                var _top = 50 - OCLOCK_RADIUS_PCT * Math.cos(_rad);

                var $btn = $('<button type="button" class="oclock-btn mono"></button>')
                    .text(i)
                    .attr('data-bearing', _bearing)
                    .attr('aria-label', 'Signal at ' + i + " o'clock")
                    .css({left: _left + '%', top: _top + '%'});
                if (i === 12){
                    $btn.addClass('oclock-btn--twelve');
                }
                $ring.append($btn);
            }
        }

        $(document).ready(function() {

            buildOclockRing();

            // Connect to the Socket.IO server.
            // The connection URL has the following format:
            //     http[s]://<domain>:<port>[/<namespace>]
            socket = io.connect(location.protocol + '//' + document.domain + ':' + location.port + namespace);

            // Grab the System config on startup.
            // Refer to config.py for the contents of the configuration blob.
            $.ajax({
                  url: "/get_config",
                  dataType: 'json',
                  async: false, // Yes, this is deprecated...
                  success: function(data) {
                    handleSettings(data);
                  }
            });


            // Tell the server we are connected and ready for data.
            socket.on('connect', function() {
                socket.emit('client_connected', {data: 'I\'m connected!'});
                // This will cause the server to emit a few messages telling us to fetch data.
            });

            socket.on('server_settings_update', function(data){
                handleSettings(data);
            });

            // This page submits *relative* bearings (compass-relative, no
            // explicit lat/lon), which the server fuses with wherever this
            // browser's own position is - so it needs to actually be
            // reporting one, same as the main map.
            startSharingMyLocation();

            var _errorToastTimer = null;
            function showErrorToast(message){
                $('#bpErrorToastText').text(message);
                $('#bpErrorToast').addClass('is-visible');
                if (_errorToastTimer) clearTimeout(_errorToastTimer);
                _errorToastTimer = setTimeout(function(){ $('#bpErrorToast').removeClass('is-visible'); }, 3200);
            }

            socket.on('bearing_rejected', function(data){
                var _reason = (data && data.reason) || '';
                if (_reason === 'no_known_position'){
                    updateLocationWarning(true);
                } else {
                    showErrorToast('Bearing not recorded.');
                }
            });

            var _lastBearingValue = null;
            var _lastBearingClock = null;
            var _lastBearingTime = null;

            function refreshLastBearingAge(){
                if (_lastBearingTime === null) return;
                var _secs = Math.round((Date.now() - _lastBearingTime) / 1000);
                var _age = _secs < 60 ? (_secs + 's ago') : (Math.round(_secs / 60) + 'm ago');
                $('#bpLastBearingAge').text('· ' + _age);
            }

            function handleOclockClick(value, clockLabel){
                _bearing_info = {
                    'type': 'BEARING',
                    'bearing_type': 'relative',
                    'source': 'EasyBearing',
                    'bearing': value,
                    'client_id': my_car_client_id,
                    'name': getMyCarName() || undefined
                };
                socket.emit('add_manual_bearing', _bearing_info);

                // Update the last-bearing-sent readout.
                _lastBearingValue = value;
                _lastBearingClock = clockLabel;
                _lastBearingTime = Date.now();
                $('#bpLastBearingValue').text(value + '° (' + clockLabel + " o'clock)");
                $('#bpLastBearing').show();
                refreshLastBearingAge();
            }

            $(document).on('click', '.oclock-btn', function(){
                if ($('#oclockPanel').hasClass('bp-sheet--warning')) return;
                var $btn = $(this);
                $btn.addClass('is-flash');
                setTimeout(function(){ $btn.removeClass('is-flash'); }, 200);
                handleOclockClick(parseInt($btn.attr('data-bearing'), 10), $btn.text());
            });

            $('#bpEnableLocationBtn').on('click', function(){
                startSharingMyLocation();
                updateLocationWarning();
            });

            function updateLocationWarning(force_on){
                var _sharing = !force_on && (typeof my_device_position_active !== 'undefined') && my_device_position_active;
                $('#oclockPanel').toggleClass('bp-sheet--warning', !_sharing);
            }
            updateLocationWarning();
            setInterval(updateLocationWarning, 1000);


            function handleTelemetry(data){
                // Telemetry Event messages contain a dictionary of position data.
                // It should have the fields:
                //  callsign: string
                //  position: [lat, lon, alt]
                //  vel_v: float
                //  time_to_landing: String
                // If callsign = 'CAR', the lat/lon/alt will be considered to be a car telemetry position.

                // Handle chase car position updates. Ignore telemetry for
                // other connected chasers' cars - this page only cares about
                // its own position (see isMyOwnCarTelemetry in car.js).
                if (data.callsign == 'CAR' && isMyOwnCarTelemetry(data)){
                    // Update car position.
                    chase_car_position.latest_data = data.position;
                    chase_car_position.heading = data.heading; // degrees true
                    chase_car_position.speed = data.speed; // m/s

                    if (typeof data.heading === 'number'){
                        $('#bpHeadingValue').text(Math.round(data.heading) + '°');
                    }
                }
            }


            // Telemetry event handler.
            // We will get one of these mesages with every new balloon position
            socket.on('telemetry_event', function(data) {
                handleTelemetry(data);
            });


            window.setInterval(function () {
                updateTimeSeqClock();
                refreshLastBearingAge();
            }, 500);

        });
    </script>
</head>
<body class="dark-theme">
    <div class="bp-header">
        <a href="/" class="bp-back" aria-label="Back to map">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
        </a>
        <div class="bp-header-title">O'Clock</div>
        <div id="bpFoxChip" class="bp-foxchip">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l3 2"></path></svg>
            <span id="bpFoxChipText" class="mono">FOX &middot; 0.0s</span>
        </div>
    </div>

    <div id="bpErrorToast" class="bp-error-toast">
        <span id="bpErrorToastText">Bearing not recorded.</span>
    </div>

    <div id="oclockPanel">
        <div class="bp-normal-state oclock-wrap">
            <div class="oclock-hint mono">TAP THE DIRECTION YOU HEAR THE SIGNAL</div>
            <div class="oclock-ring">
                <svg class="oclock-ring-svg" width="100%" height="100%" viewBox="0 0 400 400">
                    <circle cx="200" cy="200" r="178" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.1)"></circle>
                    <circle cx="200" cy="200" r="130" fill="none" stroke="rgba(255,255,255,.06)"></circle>
                    <line x1="200" y1="200" x2="200" y2="53" stroke="#6f9fd8" stroke-width="3"></line>
                    <polygon points="200,40 192,58 208,58" fill="#6f9fd8"></polygon>
                    <circle cx="200" cy="200" r="6" fill="#e6eef6"></circle>
                </svg>
                <div id="oclockRing"></div>
                <div class="oclock-heading">
                    <div class="oclock-heading-label mono">HEADING</div>
                    <div id="bpHeadingValue" class="oclock-heading-value mono">&mdash;</div>
                </div>
            </div>
            <div id="bpLastBearing" class="bp-last-bearing mono" style="display:none;">
                <span>Last bearing:</span>
                <span id="bpLastBearingValue" class="bp-last-bearing-value"></span>
                <span id="bpLastBearingAge" class="bp-last-bearing-age"></span>
            </div>
        </div>
        <div class="bp-warning-state oclock-wrap">
            <div class="bp-warning-box" style="max-width:320px;margin-left:auto;margin-right:auto;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"></path><path d="M12 17h.01"></path><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path></svg>
                <div>
                    <div class="bp-warning-title">Location sharing is off</div>
                    <div class="bp-warning-sub">A bearing needs your position to be recorded. Enable sharing to continue.</div>
                </div>
            </div>
            <button type="button" id="bpEnableLocationBtn" class="bp-warning-btn" style="max-width:320px;margin:0 auto;">Enable Location Sharing</button>
        </div>
    </div>

</body>
